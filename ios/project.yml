name: ContentScheduler
options:
  bundleIdPrefix: com.contentscheduler
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ContentScheduler:
    type: application
    platform: iOS
    sources: [ContentScheduler]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contentscheduler.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scheduler
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Para elegir los videos que vas a programar.
        INFOPLIST_KEY_NSCameraUsageDescription: Para grabar en vivo y sacar clips mientras grabas.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Para grabar el audio de tus en vivos y detectar los mejores momentos.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Para proteger la app con Face ID.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Para crear los subtítulos automáticos de tus videos.
    info:
      path: ContentScheduler/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            LSHandlerRank: Alternate
            CFBundleTypeRole: Editor
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, public.video]
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(GOOGLE_REVERSED_CLIENT_ID)"]
        GoogleClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        MetaAppID: "$(META_APP_ID)"
        ClipAIURL: "$(CLIP_AI_URL)"
        ClipServerURL: "$(CLIP_SERVER_URL)"
        NIMEmbeddedKey: "$(NIM_EMBEDDED_KEY)"
        TwitchClientID: "$(TWITCH_CLIENT_ID)"
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Anton-Regular.ttf, ArchivoBlack-Regular.ttf, Bangers-Regular.ttf, BebasNeue-Regular.ttf, LuckiestGuy-Regular.ttf, Poppins-Black.ttf, Poppins-ExtraBold.ttf]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.contentscheduler.app.refresh]
