<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="tiktok-developers-site-verification" content="adkXRTwC0Mjqrc7lotdCf7IUAmLYFd5v">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Scheduler</title>
<meta name="description" content="Corta clips de tus videos largos y publícalos a la hora que elijas.">
<link rel="icon" href="icono.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070708;--bg2:#101012;--fg:#F5F3EF;--muted:#8B8890;--accent:#FF0A8A;--line:#222126}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:Nunito,-apple-system,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .caja{max-width:520px;text-align:center}
  img{width:76px;height:76px;border-radius:19px;margin-bottom:22px}
  h1{font-size:30px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em}
  p{color:var(--muted);line-height:1.6;margin-bottom:28px}
  .enlaces{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{color:var(--fg);text-decoration:none;background:var(--bg2);border:1px solid var(--line);
    border-radius:11px;padding:11px 18px;font-weight:700;font-size:14px}
  a:hover{border-color:var(--accent)}
  a.principal{display:inline-block;background:var(--accent);border-color:var(--accent);color:#fff;
    font-size:17px;padding:15px 28px;border-radius:14px;margin-bottom:22px}
  a.principal:hover{filter:brightness(1.1)}
  .fuente{margin-top:26px;font-size:12px;color:var(--muted)}
  .fuente a{background:none;border:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline}
</style>
</head>
<body>
  <div class="caja">
    <img src="icono.svg" alt="">
    <h1>Content Scheduler</h1>
    <p>Corta clips de tus videos largos, les pone subtítulos y los publica
       en tus redes a la hora que elijas.</p>
    <!-- Cambia esta URL si el proyecto del Clipper en Vercel tiene otro nombre -->
    <a class="principal" href="https://contentscheduler-clipper.vercel.app">✂️ Abrir Clipper</a>
    <div class="enlaces">
      <a href="legal/terminos.html">Términos de servicio</a>
      <a href="legal/privacidad.html">Política de privacidad</a>
    </div>
    <p class="fuente">El Clipper se basa en SupoClip (AGPL-3.0) ·
      <a href="https://github.com/k2nchin/Content-Scheduler/tree/main/clipper-web">Código fuente</a></p>
  </div>
</body>
</html>
