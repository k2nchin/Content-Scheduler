name: iOS IPA

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Incluir la clave de NVIDIA (Secret NIM_API_KEY, si existe)
        env:
          NIM: ${{ secrets.NIM_API_KEY }}
        run: |
          if [ -n "$NIM" ]; then
            printf '\nNIM_EMBEDDED_KEY = %s\n' "$NIM" >> ios/Config.xcconfig
            echo "Clave de NVIDIA incluida."
          else
            echo "Sin Secret NIM_API_KEY: la clave se pone en Ajustes de la app."
          fi
      - name: Generar y compilar
        working-directory: ios
        run: |
          set +e
          {
            echo "=== xcodegen ==="
            xcodegen generate 2>&1
            echo "[xcodegen terminó con $?]"
            echo "=== xcodebuild ==="
            xcodebuild -project ContentScheduler.xcodeproj -target ContentScheduler \
              -sdk iphoneos -configuration Release SYMROOT="$PWD/build" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1
            echo "[xcodebuild terminó con $?]"
          } > build.log
          {
            echo "## Resultado"
            echo '```'
            grep -E "error:|terminó con|BUILD (SUCCEEDED|FAILED)" build.log | sed 's#.*/ios/##' | sort -u | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -40 build.log
          grep -q "BUILD SUCCEEDED" build.log
          test -f build/Release-iphoneos/ContentScheduler.app/ContentScheduler
      - name: Empaquetar .ipa
        working-directory: ios
        run: |
          mkdir -p Payload && cp -R build/Release-iphoneos/ContentScheduler.app Payload/
          zip -qr ContentScheduler.ipa Payload
      - name: Guardar el registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ContentScheduler-ipa
          path: ios/ContentScheduler.ipa
      # Publicar en Releases es una comodidad: si GitHub se pone tonto, la
      # compilación no debe darse por fallida, que el .ipa ya está hecho.
      - name: Publicar en Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios/ContentScheduler.ipa --target "$GITHUB_SHA" --prerelease \
            --title "Content Scheduler iOS (sin firmar)" \
            --notes "Compilado de ${GITHUB_SHA::7}. Sin firmar: instálalo con Sideloadly o AltStore usando tu Apple ID."
