name: iOS IPA

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Incluir la clave de NVIDIA (Secret NIM_API_KEY, si existe)
        env:
          NIM: ${{ secrets.NIM_API_KEY }}
        run: |
          if [ -n "$NIM" ]; then
            printf '\nNIM_EMBEDDED_KEY = %s\n' "$NIM" >> ios/Config.xcconfig
            echo "Clave de NVIDIA incluida."
          else
            echo "Sin Secret NIM_API_KEY: la clave se pone en Ajustes de la app."
          fi
      - name: Generar proyecto de Xcode
        working-directory: ios
        run: xcodegen generate
      - name: Compilar (sin firmar)
        working-directory: ios
        run: |
          xcodebuild -project ContentScheduler.xcodeproj -target ContentScheduler \
            -sdk iphoneos -configuration Release SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log || true
          # Si no compiló, que falle aquí (y no se publique una .ipa vacía)
          grep -q "BUILD SUCCEEDED" build.log
          test -f build/Release-iphoneos/ContentScheduler.app/ContentScheduler
      - name: Empaquetar .ipa
        working-directory: ios
        run: |
          mkdir -p Payload && cp -R build/Release-iphoneos/ContentScheduler.app Payload/
          zip -qr ContentScheduler.ipa Payload
      - name: Guardar el registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ContentScheduler-ipa
          path: ios/ContentScheduler.ipa
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios/ContentScheduler.ipa --target "$GITHUB_SHA" --prerelease \
            --title "Content Scheduler iOS (sin firmar)" \
            --notes "Compilado de ${GITHUB_SHA::7}. Sin firmar: instálalo con Sideloadly o AltStore usando tu Apple ID."
