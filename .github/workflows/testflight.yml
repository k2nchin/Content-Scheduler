name: iOS TestFlight

# Firma la app con tu cuenta de Apple Developer y la sube a TestFlight.
# Necesita estos Secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID              Team ID de developer.apple.com > Membership
#   ASC_KEY_ID                 Key ID de la clave de App Store Connect API
#   ASC_ISSUER_ID              Issuer ID de esa clave
#   ASC_KEY_P8                 Contenido completo del archivo .p8 de esa clave
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**"]
  schedule:
    - cron: "17 14 1 */2 *"   # cada 2 meses, antes de que caduque la versión de 90 días

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - name: Revisar que estén los Secrets
        id: check
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY" ]; then
            echo "Faltan los Secrets de Apple; no se sube a TestFlight."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Preparar la clave de App Store Connect
        if: steps.check.outputs.ok == 'true'
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
      - name: Generar proyecto
        if: steps.check.outputs.ok == 'true'
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Archivar y firmar
        if: steps.check.outputs.ok == 'true'
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD=$(date +%Y%m%d%H%M)
          xcodebuild -project ContentScheduler.xcodeproj -scheme ContentScheduler -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ContentScheduler.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            archive
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ContentScheduler.xcarchive \
            -exportOptionsPlist build/export.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
